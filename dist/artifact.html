<title>Cellar of Ruin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Teko:wght@500;600&display=swap">
<style>
/* one screen, one dark world: the cellar at night. Display: Grenze Gotisch (banners, floor cards). HUD: Teko (numbers, names). */
:root { --void: #0b0c0f; --ember: #ecc878; --bone: #efe4cc; --ash: #8f8472; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--bone); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

#c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: var(--void); cursor: pointer; }
#safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
[hidden] { display: none !important; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ember); font: 900 2.4rem "Grenze Gotisch", "Palatino Linotype", Palatino, serif; letter-spacing: 0.04em; background: var(--void); }
@media (orientation: portrait) and (pointer: coarse) { #loading { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { #loading { letter-spacing: 0.02em; } }
</style>

function holyBolt(h, t) { const m = md('HOLY BOLT'), a0 = angTo(h.x, h.y, t.x, t.y), n = 1 + m.count; for (let i = 0; i < n; i++) { const a = a0 + (n > 1 ? (i / (n - 1) - 0.5) * 0.5 : 0); proj({ k: 'mshot', shot: 'orb', col: 'holy', x: h.x, y: h.y, z: 10, vx: Math.cos(a) * 170, vy: Math.sin(a) * 125, home: m.f.seek ? t : undefined, life: 1.4, r: 3, dmg: D(h) * 0.95 * m.dmg, src: h, team: 'hero' }); } SFX.zap(panOf(h.x)); }
function censer(h, t) { const m = md('CENSER'), a = angTo(h.x, h.y, t.x, t.y), R = 60 * m.size; h.lunge = 0.15; h.la = a; HFX.censer(h.x, h.y, a, m.size); for (const u of within(h.x, h.y, R, G.mons)) if (Math.abs(angDiff(angTo(h.x, h.y, u.x, u.y), a)) < 0.45 * m.size + 0.15) { hurt(u, D(h) * 0.55 * m.dmg, h, { elem: 'holy', quiet: true }); if (m.f.burn) u.burn = Math.max(u.burn, 1.2); } }
function layOnHands(h, t) { const m = md('LAY ON HANDS'), x = t && t.team === 'hero' ? t : h; heal(x, x.maxHp * 0.35 * m.dmg); HFX.holyPillar(x.x, x.y, 0.8); if (m.f.renew) x.regen = { t: 4, per: x.maxHp * 0.03, tick: 0 }; SFX.heal(); }
function blessing(h) { const m = md('BLESSING'); for (const x of G.heroes) if (!x.dead) { x.blessT = 5 * m.dur; HFX.bless(x.x, x.y); if (m.f.heal) heal(x, x.maxHp * 0.1); } SFX.heal(); }
function consecrate(h, p) { const m = md('CONSECRATE'), R = 34 * m.size; hazard({ k: 'consecrate', x: p.x, y: p.y, r: R, life: 4 * m.dur, rate: 0.5, dmg: D(h) * 0.5 * m.dmg, src: h }); HFX.holyBurst(p.x, p.y, R); SFX.charge && SFX.charge(); }
function radiantSpear(h, t) { const m = md('RADIANT SPEAR'), a0 = angTo(h.x, h.y, t.x, t.y), n = 1 + m.count; for (let i = 0; i < n; i++) { const a = a0 + (n > 1 ? (i / (n - 1) - 0.5) * 0.5 : 0), [x1, y1] = rayEnd(h.x, h.y - 8, a, 150 * m.size); FX.beams.push({ x0: h.x, y0: h.y - 8, x1, y1, w: 2.2, col: 'holy', t: 0, life: 0.3, cap: true }); HFX.spear(h.x, h.y, x1, y1 + 8); for (const u of live(G.mons)) if (segDist(u.x, u.y - 6, h.x, h.y - 8, x1, y1) < 8 + u.r) hurt(u, D(h) * 1.4 * m.dmg, h, { elem: 'holy', kx: Math.cos(a) * 120, ky: Math.sin(a) * 90 }); } SFX.zap(panOf(h.x)); }
function holyNova(h) { const m = md('HOLY NOVA'), R = 55 * m.size, pulse = () => { for (const u of within(h.x, h.y, R, G.mons)) { const a = angTo(h.x, h.y, u.x, u.y); hurt(u, D(h) * 1.4 * m.dmg, h, { elem: 'holy', kx: Math.cos(a) * 200, ky: Math.sin(a) * 150 }); } for (const x of G.heroes) if (!x.dead && dist(h.x, h.y, x.x, x.y) < R * 1.4) heal(x, x.maxHp * 0.08 * (m.f.mercy ? 2 : 1)); HFX.holyBurst(h.x, h.y, R); flash('white', 0.12); SFX.boom(0.5, panOf(h.x)); }; pulse(); for (let k = 1; k <= m.count; k++) after(k * 0.45, () => { if (alive(h)) pulse(); }); }
function guardianAngel(h) { const m = md('GUARDIAN ANGEL'); banner('GUARDIAN ANGEL', h); for (let k = 0; k <= m.count; k++) { const ox = (k % 2 ? 1 : -1) * (18 + 8 * k); hazard({ k: 'angel', spr: 'ResoluteAngel', x: h.x + ox, y: h.y - 4, ox, face: ox < 0 ? 1 : -1, src: h, follow: true, life: 8 * m.dur, rate: 0.7, dmg: D(h) * 1.1 * m.dmg }); HFX.angelDown(h.x + ox, h.y); } }
function chainsOfLight(h, p) { const m = md('CHAINS OF LIGHT'), ts = live(G.mons).filter(u => dist(p.x, p.y, u.x, u.y) < 60).slice(0, 4 + m.count); for (const u of ts) { u.stun = Math.max(u.stun, 1.8 * m.dur); FX.beams.push({ x0: h.x, y0: h.y - 8, x1: u.x, y1: u.y - 6, w: 1.2, col: 'holy', t: 0, life: 0.5, cap: true }); HFX.chain(h.x, h.y - 8, u.x, u.y); if (m.f.sear) hurt(u, D(h) * 1.2, h, { elem: 'holy' }); } SFX.clang(panOf(p.x)); }

function sanctuary(h) { const m = md('SANCTUARY'); banner('SANCTUARY', h); hazard({ k: 'sanct', x: h.x, y: h.y, r: 60 * m.size, life: 6 * m.dur, rate: 0.5, dmg: D(h) * 0.4 * m.dmg, src: h, heal: m.f.heal ? 2 : 1 }); HFX.holyBurst(h.x, h.y, 60 * m.size); SFX.levelup(); }
function miracle(h) { const m = md('MIRACLE'); banner('MIRACLE', h); for (const x of G.heroes) { if (x.dead) { if (typeof reviveHero === 'function') reviveHero(x, h); x.hp = Math.round(x.maxHp * 0.6); } else heal(x, x.maxHp * 0.4 * m.dmg); if (m.f.halo) x.blessT = 4; HFX.miracle(x.x, x.y); hazard({ k: 'cherub', x: x.x, y: x.y, u: x.id, life: 1.8 }); } flash('white', 0.35); }
function abduction(h, p) {
  const m = md('ABDUCTION'), R = 44 * m.size, ts = live(G.mons).filter(u => dist(p.x, p.y, u.x, u.y) < R).sort((a, b) => dist(p.x, p.y, a.x, a.y) - dist(p.x, p.y, b.x, b.y)).slice(0, 3 + m.count);
  if (!ts.length && p.team === 'mon' && alive(p)) ts.push(p);
  banner('ABDUCTION', h); HFX.batBurst(h.x, h.y, 10); SFX.whoosh(panOf(p.x));
  ts.forEach((u, i) => {
    const heavy = !!(u.boss || u.rank === 'warlord'), A = ARENA;
    // regular foes fly to the nearest wall (rarely toward the camera); the heavy ones only go up
    const e = [[-1, 0, u.x - A.x0], [1, 0, A.x1 - u.x], [0, -1, (u.y - A.y0) * 1.2], [0, 1, (A.y1 - u.y) * 2.5]].sort((a, b) => a[2] - b[2])[0];
    u.carried = heavy ? 1 : 2; u.state = null; u.vx = u.vy = u.kx = u.ky = u.vz = 0;
    hazard({ k: 'abduct', m: u, uid: u.id, x: u.x, y: u.y, h: u.z, bx: u.x, s: u.scale, dx: e[0], dy: e[1], sp: 0, st: 0, heavy: heavy ? 1 : 0, n: heavy ? 9 : 4 + (i % 2), feed: m.f.feed ? 1 : 0, dmg: D(h) * 3.5 * m.dmg, delay: i * 0.1, life: 6, src: h });
  });
}
function judgment(h) {
  const m = md('JUDGMENT'); banner('JUDGMENT', h); SFX.braam(); flash('white', 0.35); slowmo(0.4, 0.6);
  const n = 3 + m.count; for (let k = 0; k < n; k++) { const a = k / n * TAU - Math.PI / 2, x = ARENA.pw / 2 + Math.cos(a) * ARENA.pw * 0.28, y = (ARENA.y0 + ARENA.y1) / 2 + Math.sin(a) * (ARENA.y1 - ARENA.y0) * 0.28; hazard({ k: 'angel', spr: ['SwordArchon', 'RighteousDeva', 'DivinePlanetar'][k % 3], x, y, ox: 0, face: 1, src: h, big: true, life: 6, rate: 0.35, dmg: D(h) * 1.4 * m.dmg }); HFX.angelDown(x, y); }
  const d = densest(G.mons, 50, h, 400) || { x: h.x, y: h.y }; after(1.7, () => hazard({ k: 'sword', x: d.x, y: d.y, r: 0, life: 0.5 }));
  after(2.2, () => { HFX.swordFall(d.x, d.y); for (const u of within(d.x, d.y, 70, G.mons)) hurt(u, D(h) * 6 * m.dmg, h, { elem: 'holy', up: 260, stun: 1.2, crit: true }); for (const x of G.heroes) if (!x.dead) heal(x, x.maxHp * 0.25 * (m.f.mercy ? 2 : 1)); hitstop(0.12); });
}

// Whooshes hurl the horde away (a foe that hits a wall in flight takes the slam). Tornadoes suck foes in, carry them
// up and round in a spiral and fling them out to crash down. Lightning is the other half of the storm: it strikes
// whatever is airborne 50% harder.

// ---------- wind physics ----------
// a cone of wind: everything inside is hurled away; whoever hits a wall while still flying takes the slam
function blow(h, x, y, a, cone, range, power, dmg, slam) {
  for (const u of live(G.mons)) {
    const d = dist(x, y, u.x, u.y); if (d > range + u.r || Math.abs(angDiff(angTo(x, y, u.x, u.y), a)) > cone || u.carried) continue;
    const f = 1 - 0.45 * d / range; hurt(u, dmg, h, { elem: 'wind', kx: Math.cos(a) * power * f, ky: Math.sin(a) * power * f * 0.75 });
    if (!u.boss) { u.windT = 0.9; u.windDmg = slam; u.windSrc = h; }
  }
}
// called from moveUnit: a foe still flying from a gust hits the wall
function windWall(u, A) {
  if ((u.x < A.x0 + u.r + 1 && u.kx < -110) || (u.x > A.x1 - u.r - 1 && u.kx > 110) || (u.y < A.y0 + u.r * 0.4 + 1 && u.ky < -80) || (u.y > A.y1 - 1 && u.ky > 80)) {
    u.windT = 0; if (u.windDmg && !u.dead) { hurt(u, u.windDmg, u.windSrc, { elem: 'wind', stun: 0.5 }); HFX.slam(u.x, u.y); }
  }
}
// thrown out of a tornado: it falls, and the landing hurts
function fling(u, a, power, drop, src) { u.carried = 0; u.vz = 70; u.z = Math.max(u.z, 1); u.kx = Math.cos(a) * power; u.ky = Math.sin(a) * power * 0.7; u.dropDmg = drop; u.dropSrc = src; u.windT = 0.9; u.windDmg = drop * 0.5; u.windSrc = src; u.moving = false; }
const airborne = f => f.filter(u => u.air);

// ---------- the zones on the host ----------
Object.assign(HAZSIM, {
  // a tornado drifts at the crowd, pulls foes in, carries them up and round, and throws them out
  twister(z, dt, tick) {
    const A = ARENA, R = z._r || (z._r = []);
    if (z.spd) { if ((z.aimT = (z.aimT || 0) - dt) <= 0) { z.aimT = 1; const d = densest(live(G.mons), 40, z, 260); if (d) { const a = angTo(z.x, z.y, d.x, d.y); z.vx = Math.cos(a) * z.spd; z.vy = Math.sin(a) * z.spd * 0.7; } } z.x = clamp(z.x + (z.vx || 0) * dt, A.x0 + 10, A.x1 - 10); z.y = clamp(z.y + (z.vy || 0) * dt, A.y0 + 8, A.y1 - 6); }
    for (const u of G.mons) {
      if (u.dead || u.spawnT > 0 || u.carried || u.frozen > 0) continue; const d = dist(z.x, z.y, u.x, u.y); if (d > z.pull) continue;
      if (d < z.r + u.r && !u.boss && R.length < z.cap) { u.carried = 1; u.air = 1; u.state = null; u.vx = u.vy = 0; R.push({ u, a: angTo(z.x, z.y, u.x, u.y), h: u.z, t: 0, ride: z.ride * rand(0.8, 1.2) }); hurt(u, z.dmg, z.src, { elem: 'wind' }); continue; }
      const a = angTo(u.x, u.y, z.x, z.y) + 0.6, k = z.suck * (u.boss ? 0.15 : 1) * (1 - 0.5 * d / z.pull); u.kx += Math.cos(a) * k * dt; u.ky += Math.sin(a) * k * 0.7 * dt;
    }
    const ending = z.t > z.life - 0.2;
    for (const r of R) {
      const u = r.u; if (u.dead) { u.carried = 0; u.air = 0; r.done = true; continue; }
      r.t += dt; r.a += dt * (4 + r.t * 2.5); r.h = Math.min(z.top, r.h + dt * z.top / 0.9); const f = r.h / z.top, rad = lerp(z.r * 0.35, z.r * 1.1, f * f), sway = Math.sin(G.time * 2.3 + f * 3.2) * 7 * f;
      u.x = z.x + sway + Math.cos(r.a) * rad; u.y = z.y + Math.sin(r.a) * rad * 0.3; u.z = r.h; u.vz = 0; u.kx = u.ky = 0; u.face = Math.sin(r.a) > 0 ? 1 : -1; u.moving = true;
      if (tick) hurt(u, z.dmg * 0.6, z.src, { elem: 'wind', quiet: true });
      if (r.t >= r.ride || ending) { fling(u, r.a + 1.3, z.big ? 300 : 220, z.drop, z.src); r.done = true; }
    }
    removeIf(R, r => r.done);
    if (z.lightning && (z.zapT = (z.zapT || 0) - dt) <= 0) { z.zapT = z.lightning; const t = R.length ? pick(R).u : pick(live(G.mons)); if (t) { HFX.skyBolt(t.x, t.y + t.z * 0.3); zapHit(t, z.src, z.zap); } }
  },
  blade(z, dt) {
    z.x += z.vx * dt; z.y += z.vy * dt; if (!inArena(z.x, z.y)) { z.dead = true; return; }
    for (const u of G.mons) { if (u.dead || u.spawnT > 0 || u.carried === 2 || z.hit.has(u) || dist(z.x, z.y, u.x, u.y) > u.r + 7 * (z.s || 1)) continue; z.hit.add(u); hurt(u, z.dmg, z.src, { elem: 'wind', kx: z.vx * 0.35, ky: z.vy * 0.35 }); if (z.hit.size >= z.pierce) { z.dead = true; HFX.thud(z.x, z.y); return; } }

    if (!tick) return; for (const u of within(z.x, z.y, z.r, G.mons)) { if (u.carried) continue; const a = angTo(z.x, z.y, u.x, u.y); hurt(u, z.dmg, s, { elem: 'wind', quiet: true, kx: Math.cos(a) * z.push, ky: Math.sin(a) * z.push * 0.7 }); if (!u.boss) { u.windT = 0.7; u.windDmg = z.slam; u.windSrc = s; } }

});

// ---------- Voltaire's spells ----------
function twister(h, o) { const z = hazard({ k: 'twister', x: o.x, y: o.y, r: o.r, pull: o.pull, suck: o.suck || 220, cap: o.cap, top: o.top, ride: o.ride, spd: o.spd || 0, dmg: o.dmg, drop: o.drop, big: o.big ? 1 : 0, lightning: o.lightning || 0, zap: o.zap || 0, life: o.life, rate: 0.4, src: h }); HFX.twisterStart(o.x, o.y, o.big ? 2 : 1); return z; }

function whoosh(h, t) { const m = md('WHOOSH'), a = angTo(h.x, h.y, t.x, t.y); h.lunge = 0.25; h.la = a; for (let k = 0; k <= m.count; k++) after(k * 0.3, () => { if (!alive(h)) return; HFX.whoosh(h.x, h.y, a, 0.9 * m.size, 110 * m.size); blow(h, h.x, h.y, a, 0.9 * m.size, 110 * m.size, 440, D(h) * 0.9 * m.dmg, D(h) * 1.5 * m.dmg * (m.f.slam ? 2 : 1)); }); }
function dustDevil(h, t) { const m = md('DUST DEVIL'); twister(h, { x: t.x, y: t.y, r: 14 * m.size, pull: 44 * m.size, cap: 2 + m.count, top: 34, ride: 1.2, spd: 40, dmg: D(h) * 0.45 * m.dmg, drop: D(h) * 0.9 * m.dmg, life: 4 * m.dur }); }
function crosswind(h, p) {
  const m = md('CROSSWIND'), R = 50 * m.size; HFX.crosswind(p.x, p.y, R);
  for (const u of within(p.x, p.y, R, G.mons)) { if (u.carried) continue; u.kx += Math.sign(p.x - u.x || 1) * (u.boss ? 40 : 300); u.ky += (p.y - u.y) * 2; }
