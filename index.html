<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ashen Mandate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A first-person party dungeon crawler in the spirit of Might and Magic VI and Dark Souls, built from 16x16 pixel art.">
<meta name="theme-color" content="#0b0a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ashen Mandate">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
<style>
:root { color-scheme: dark; --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: Georgia, serif; }
canvas { display: block; position: absolute; left: 0; top: 0; }
#view { image-rendering: pixelated; image-rendering: crisp-edges; z-index: 1; background: #000; }
#hud { z-index: 2; }
#rotate { display: none; position: absolute; inset: 0; z-index: 10; background: #0b0a10; color: #e8c060; align-items: center; justify-content: center; text-align: center; font-size: 20px; letter-spacing: 2px; padding: 24px; }
#loading { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; color: #c8b8a0; font-size: 18px; letter-spacing: 3px; background: #0b0a10; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>
<div id="rotate"><div>ROTATE YOUR DEVICE<br><small style="font-size:13px;letter-spacing:1px;color:#8a8078">Ashen Mandate is played in landscape</small></div></div>
<div id="loading">LIGHTING THE BONFIRE...</div>
<script>window.ASSET_SRC = { tiles: 'assets/tiles.png', creatures: 'assets/creatures.png', cindex: 'assets/creatures.json' };
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=202611062344').catch(() => {})); }</script>
<script src="game.js?v=202611062344"></script>
</body>
</html>
