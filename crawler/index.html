// ---- 90_main.js ----
// ===================== main loop =====================
let last = 0; const PERF = { acc: 0, n: 0, good: 0 };
function update(dt) { G.time += dt; updateRun(dt); updateFx(dt); }
function frame(t) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
  PERF.acc += rdt; PERF.n++; if (PERF.n >= 90) { const avg = PERF.acc / PERF.n; PERF.acc = PERF.n = 0; if (avg > 0.026 && Q.res > 0.55) { Q.res = Math.max(0.55, Q.res - 0.15); Q.pmax = Math.max(1200, Q.pmax - 400); resize(); PERF.good = 0; } else if (avg > 0.034) Q.bloom = 0.5; else if (avg < 0.0175 && ++PERF.good > 3 && Q.res < 1) { Q.res = Math.min(1, Q.res + 0.1); resize(); PERF.good = 0; } }
  try {
    pollPad();
    if (G.mode === 'play' && !UI.paused) {
      readInput(); if (window.CR_BOT) botDrive(G.me, rdt);
      if (G.hitstop > 0) G.hitstop -= rdt;
      else { if (G.slowT > 0) G.slowT -= rdt; else G.ts = damp(G.ts, 1, 3, rdt); const n = window.CR_TURBO || 1; for (let i = 0; i < n; i++) update(rdt * G.ts); }
      if (G.phase === 'play') G.fade = Math.max(0, G.fade - rdt * 1.4);
      if (G.card) { G.card.t += rdt; if (G.card.t >= G.card.life) G.card = null; }
    } else if (G.mode !== 'play') { G.time += rdt; for (const u of G.units) u.anim += rdt; updateFx(rdt); }
    G.flashA = damp(G.flashA, 0, 9, rdt); nextBanner(rdt);
    updateShake(rdt); updateCam(rdt); render();
  } catch (e) { console.error(e); window.CR_ERR = (window.CR_ERR || []).concat(String(e && e.stack || e)).slice(-5); }
}
// the title screen shows a quiet cellar behind it
function menuBackdrop() { buildArena(1); initSight(ARENA); G.heroes = []; G.foes = []; G.units = []; G.proj = []; G.drops = []; G.me = null; const r = ARENA.start; CAM.x = (r.ix0 + r.ix1 + 1) / 2 * TS; CAM.y = (r.iy0 + r.iy1 + 1) / 2 * TS; CAM.z = exploreZoom(); }
async function boot() {
  cvs = document.getElementById('c'); ctx = cvs.getContext('2d', { alpha: false }); fxc = mkCanvas(1, 1); fctx = fxc.getContext('2d'); lc = mkCanvas(1, 1); lctx = lc.getContext('2d'); b1 = mkCanvas(1, 1); b1c = b1.getContext('2d'); b2 = mkCanvas(1, 1); b2c = b2.getContext('2d');
  try { if (document.fonts) await Promise.race([Promise.all([document.fonts.load('900 40px "Grenze Gotisch"'), document.fonts.load('500 16px Teko'), document.fonts.load('600 16px Teko')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  await loadAssets(); resize(); addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
  setupInput(); menuBackdrop(); G.mode = 'menu'; MENU.screen = 'title';
  const ld = document.getElementById('loading'); if (ld) ld.hidden = true;
  window.CR = { G, FX, CAM, Q, SFX, VIEW, MENU, UI, INPUT, KITS, WEAPONS, FOE_TYPES, ARENA: () => ARENA, startRun, startFloor, beginRun, togglePause, toWorld, btnLayout, hurt, mkFoe, wakeFoe, fx: { debris, cracks, bloodPaint, splat, breakProp } };
  requestAnimationFrame(frame);
}
boot().catch(e => { const ld = document.getElementById('loading'); if (ld) ld.textContent = 'Failed to start: ' + e.message; console.error(e); });

// ---- 91_bot.js ----
// ===================== a test pilot (window.CR_BOT = true): plays the local hero for soak tests and screenshots =====================
// It fights the nearest foe it can see (now and then holding the blow for a heavy), raises its guard against marked blows, rolls away from slams, drinks when low and
// otherwise walks toward unexplored floor, and once the map is mostly known, to the way down.
function botDrive(h, dt) {
  if (!h || h.dead) return; const I = h.inp, A = ARENA; I.aim = null; I.block = false; I.atk = false;
  const foes = G.foes.filter(f => !f.dead && foeShown(f)), f = nearest(h, foes);
  const B = h.bot = h.bot || { t: 0, goal: null };
  const danger = foes.some(o => o.act && o.act.phase === 'wind' && dist(h.x, h.y, o.x, o.y) < 45);
  if (h.hp < h.maxHp * 0.4 && h.flasks > 0 && !h.act && !danger && (!f || dist(h.x, h.y, f.x, f.y) > 26 || h.hp < h.maxHp * 0.25)) { I.itemP = true; I.mx = I.my = 0; return; }
  if (f) {
    const d = dist(h.x, h.y, f.x, f.y), a = angTo(h.x, h.y, f.x, f.y), fa = f.act;
    if (fa && fa.k === 'atk' && fa.phase === 'wind' && d < 50) { if (fa.mv.slam || h.stam < 30 || guardOf(h).absorb < 0.6) { I.dodgeP = true; I.mx = -Math.cos(a); I.my = -Math.sin(a); } else { I.block = true; I.mx = Math.cos(a) * 0.01; I.my = Math.sin(a) * 0.01; } return; }
    const reach = weaponOf(h).combo[0].reach + f.r;
    if (d > reach) { const p = h.path && h.pathTo === 'f' + f.id ? h.path : (h.path = findPath(h.x, h.y, f.x, f.y) || [], h.pathTo = 'f' + f.id, h.path); while (p.length && dist(h.x, h.y, p[0].x, p[0].y) < 8) p.shift(); const wp = lineOfSight(h.x, h.y, f.x, f.y) ? f : p[0] || f; const l = dist(h.x, h.y, wp.x, wp.y) || 1; I.mx = (wp.x - h.x) / l; I.my = (wp.y - h.y) / l; if ((B.t -= dt) <= 0) { B.t = 1; h.path = null; } }
    else { I.mx = Math.cos(a) * 0.05; I.my = Math.sin(a) * 0.05; if (B.hold > 0) { B.hold -= dt; I.atk = true; } else if (!h.act && h.stam > 20 && chance(dt * 9)) { I.atkP = true; if (chance(0.3)) { B.hold = weaponOf(h).heavy.charge + 0.3; I.atk = true; B.heavies = (B.heavies || 0) + 1; } } }
    return;
  }

    B.t = 3; let best = null, bd = 1e9; const seenAll = A.mem.reduce((n, v, i) => n + (A.fl[i] === 1 && !v ? 1 : 0), 0) < 40;
    if (!seenAll) for (let i = 0; i < A.w * A.h; i += 3) { if (A.fl[i] !== 1 || A.mem[i]) continue; const x = (i % A.w) * TS + 8, y = ((i / A.w) | 0) * TS + 8, dd = dist(h.x, h.y, x, y); if (dd < bd) { bd = dd; best = { x, y }; } }
    B.goal = best || { x: A.stairs.x, y: A.stairs.y - 6 }; B.path = findPath(h.x, h.y, B.goal.x, B.goal.y) || [];
  }

}
