name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/inspiring-euler-1cph7t]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir -p _site/crawler && cp -r index.html manifest.webmanifest sw.js icons version.txt _site/ && cp crawler/index.html crawler/version.txt _site/crawler/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
